<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hint Cards – Berufskolleg Lübbecke</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='36' fill='none' stroke='%23e600a0' stroke-width='9' stroke-dasharray='56.55 169.64' stroke-linecap='round' transform='rotate(-90 50 50)'/%3E%3Ccircle cx='50' cy='50' r='36' fill='none' stroke='%233d3d3d' stroke-width='9' stroke-dasharray='162.76 63.43' stroke-dashoffset='-63.43' stroke-linecap='round' transform='rotate(-90 50 50)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    :root {
      --mg:         #e600a0;
      --mg-light:   #fce8f5;
      --mg-mid:     #f0a0d8;
      --dk:         #3d3d3d;
      --mid:        #6a6a6a;
      --bg:         #ffffff;
      --bg2:        #f5f5f5;
      --border:     #e0e0e0;
      --border2:    #cccccc;
      --text:       #3d3d3d;
      --text2:      #6a6a6a;
      --text3:      #999999;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; }
      :root {
        --bg:    #2a2a2a;
        --bg2:   #222222;
        --border:  #3a3a3a;
        --border2: #4a4a4a;
        --text:  #e8e8e8;
        --text2: #aaaaaa;
        --text3: #666666;
      }
    }

    /* ── Layout ── */
    .app {
      width: 100%;
      max-width: 680px;
      background: var(--bg);
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: var(--dk);
      padding: 1rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-size: 13px;
      font-weight: 700;
      color: white;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .logo { text-align: right; }
    .logo-name  { font-size: 15px; font-weight: 700; color: var(--mg); letter-spacing: 0.04em; line-height: 1; }
    .logo-city  { font-size: 12px; color: white; }
    .logo-claim { font-size: 10px; color: #aaa; }
    .logo-claim span { color: var(--mg); }

    /* ── Body padding ── */
    .body { padding: 1.25rem 1.25rem 1.5rem; }

    /* ── LF Tabs ── */
    .lf-scroll { margin-bottom: 0.5rem; }
    .lf-tabs   { display: flex; flex-wrap: wrap; gap: 0.25rem; }

    .lf-btn {
      background: var(--bg2);
      border: 1.5px solid var(--border);
      color: var(--mid);
      padding: 0.28rem 0.6rem;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito Sans', sans-serif;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .lf-btn:hover       { border-color: var(--mg); color: var(--mg); }
    .lf-btn.active      { background: var(--mg); border-color: var(--mg); color: white; }
    .lf-btn.empty       { opacity: 0.38; cursor: default; }
    .lf-btn.empty:hover { border-color: var(--border); color: var(--mid); }

    .lf-label {
      font-size: 11px;
      color: var(--text3);
      font-style: italic;
      min-height: 1.4em;
      margin: 0.4rem 0 0.85rem;
    }

    /* ── Topic Nav ── */
    .topic-nav { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.25rem; }

    .topic-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Nunito Sans', sans-serif;
      transition: all 0.15s;
    }
    .topic-btn:hover  { border-color: var(--mg); color: var(--mg); }
    .topic-btn.active { background: var(--mg-light); border-color: var(--mg); color: var(--mg); font-weight: 700; }

    /* ── Card Stack ── */
    .stack-hint { font-size: 11px; color: var(--text3); text-align: center; margin-bottom: 0.6rem; letter-spacing: 0.03em; }

    .card-wrapper { position: relative; min-height: 220px; margin-bottom: 0; }

    .ghost {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .ghost-1 { top: 7px;  height: 210px; width: calc(100% - 18px); opacity: 0.5; }
    .ghost-2 { top: 14px; height: 210px; width: calc(100% - 36px); opacity: 0.28; }

    .card {
      position: relative;
      background: var(--bg);
      border: 1.5px solid var(--border2);
      border-top: 3px solid var(--mg);
      border-radius: 14px;
      padding: 1.3rem 1.4rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      overflow: hidden;
    }
    .card.flip-out { transform: translateY(-14px) scale(0.97); opacity: 0; transition: all 0.25s ease; }
    @keyframes flipIn {
      from { transform: translateY(16px) scale(0.97); opacity: 0; }
      to   { transform: translateY(0)    scale(1);    opacity: 1; }
    }
    .card.flip-in { animation: flipIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    .card-number { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--mg); text-transform: uppercase; margin-bottom: 0.35rem; }
    .card-title  { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 0.65rem; line-height: 1.3; }
    .card-text   { font-size: 14px; color: var(--text2); line-height: 1.65; margin-bottom: 0.7rem; white-space: pre-line; }

    .card-img {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 0.6rem;
      background: var(--bg2);
      display: block;
    }
    .img-caption { font-size: 11px; color: var(--text3); text-align: center; margin-top: -0.4rem; margin-bottom: 0.6rem; }

    .card-code {
      background: var(--dk);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #e8e8e8;
      margin-bottom: 0.65rem;
      white-space: pre;
      overflow-x: auto;
    }
    .card-link { font-size: 12px; color: var(--mg); text-decoration: none; font-weight: 600; }
    .card-link:hover { text-decoration: underline; }

    /* ── Progress Dots ── */
    .progress { display: flex; justify-content: center; gap: 6px; margin: 1rem 0 0.9rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border2); transition: all 0.22s; }
    .dot.revealed { background: var(--mg-mid); transform: scale(1.1); }
    .dot.current  { background: var(--mg); transform: scale(1.35); box-shadow: 0 0 0 2px var(--mg-light); }

    /* ── Buttons ── */
    .btns { display: flex; gap: 0.6rem; justify-content: center; }

    .btn-next {
      background: var(--mg);
      color: white;
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito Sans', sans-serif;
      transition: background 0.15s;
    }
    .btn-next:hover { background: #c20090; }

    .btn-reset {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Nunito Sans', sans-serif;
      transition: all 0.15s;
    }
    .btn-reset:hover { border-color: var(--mg); color: var(--mg); }

    /* ── States ── */
    .state-msg {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text3);
      font-size: 13px;
    }
    .finished {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text2);
      font-size: 14px;
    }
    .finished .check { font-size: 30px; margin-bottom: 0.5rem; }
    .finished strong { display: block; font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 0.4rem; }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 0.6rem 1rem;
      font-size: 11px;
      color: var(--text3);
      border-top: 1px solid var(--border);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-title">HINT<span style="color:var(--mg)">_</span>CARDS: Gestuftes Hilfesystem</div>
    <div class="logo">
      <div class="logo-name">BERUFSKOLLEG</div>
      <div class="logo-city">Lübbecke</div>
      <div class="logo-claim">vielfältig <span>·</span> innovativ <span>·</span> für dich</div>
    </div>
  </div>

  <div class="body">
    <!-- LF Navigation -->
    <div class="lf-scroll">
      <div class="lf-tabs" id="lfTabs"></div>
    </div>
    <div class="lf-label" id="lfLabel"></div>

    <!-- Topic Navigation -->
    <div class="topic-nav" id="topicNav"></div>

    <!-- Card Area -->
    <div id="cardArea">
      <div class="state-msg">Wähle oben ein Lernfeld.</div>
    </div>
  </div>

  <div class="footer">© <span id="footerYear"></span> Bg</div>

</div>

<script>
  // ── Load cards from cards.json ──────────────────────────────────────────
  let DATA = {};
  let curLF  = null;
  let curSub = null;
  let curIdx = 0;

  fetch('cards.json')
    .then(r => r.json())
    .then(json => {
      DATA = json;
      renderLF();
    })
    .catch(() => {
      document.getElementById('cardArea').innerHTML =
        '<div class="state-msg">⚠ cards.json konnte nicht geladen werden.<br>Stelle sicher, dass die Datei im selben Ordner liegt.</div>';
    });

  // ── Render LF Tabs ───────────────────────────────────────────────────────
  function renderLF() {
    const tabs = document.getElementById('lfTabs');
    tabs.innerHTML = '';
    Object.entries(DATA).forEach(([lf, val]) => {
      const hasContent = Object.keys(val.topics).length > 0;
      const btn = document.createElement('button');
      btn.className = 'lf-btn' + (lf === curLF ? ' active' : '') + (!hasContent ? ' empty' : '');
      btn.textContent = lf;
      btn.title = val.label;
      if (hasContent) {
        btn.onclick = () => {
          curLF = lf; curSub = null; curIdx = 0;
          renderLF(); renderLabel(); renderTopics(); renderCard();
        };
      }
      tabs.appendChild(btn);
    });
  }

  function renderLabel() {
    document.getElementById('lfLabel').textContent = curLF ? DATA[curLF].label : '';
  }

  // ── Render Topic Buttons ─────────────────────────────────────────────────
  function renderTopics() {
    const nav = document.getElementById('topicNav');
    nav.innerHTML = '';
    if (!curLF) return;
    Object.keys(DATA[curLF].topics).forEach(topic => {
      const btn = document.createElement('button');
      btn.className = 'topic-btn' + (topic === curSub ? ' active' : '');
      btn.textContent = topic;
      btn.onclick = () => { curSub = topic; curIdx = 0; renderTopics(); renderCard(); };
      nav.appendChild(btn);
    });
  }

  // ── Render Card ──────────────────────────────────────────────────────────
  function renderCard() {
    const area = document.getElementById('cardArea');

    if (!curLF) {
      area.innerHTML = '<div class="state-msg">Wähle oben ein Lernfeld.</div>';
      return;
    }
    if (!curSub) {
      const count = Object.keys(DATA[curLF].topics).length;
      area.innerHTML = count
        ? '<div class="state-msg">Wähle ein Thema.</div>'
        : '<div class="state-msg">Für dieses Lernfeld sind noch keine Hilfekarten hinterlegt.</div>';
      return;
    }

    const cards     = DATA[curLF].topics[curSub];
    const total     = cards.length;
    const remaining = total - curIdx;

    if (curIdx >= total) {
      area.innerHTML = `
        <div class="finished">
          <div class="check">✓</div>
          <strong>Alle Hilfekarten aufgedeckt</strong>
          Du hast alle ${total} Karten zu diesem Thema gesehen.
          <br><br>
          <button class="btn-reset" onclick="resetCards()">↩ Nochmal von vorne</button>
        </div>`;
      return;
    }

    const card = cards[curIdx];

    // Ghost cards (stack effect)
    let ghosts = '';
    if (remaining > 2) ghosts += '<div class="ghost ghost-2"></div>';
    if (remaining > 1) ghosts += '<div class="ghost ghost-1"></div>';

    // Card body
    let body = `<div class="card-text">${escHtml(card.text)}</div>`;

    if (card.image) {
      body += `<img class="card-img" src="${escAttr(card.image)}" alt="${escAttr(card.image_caption || '')}"
                 onerror="this.style.display='none'">`;
      if (card.image_caption) body += `<div class="img-caption">${escHtml(card.image_caption)}</div>`;
    }
    if (card.code) {
      body += `<div class="card-code">${escHtml(card.code)}</div>`;
    }
    if (card.link) {
      body += `<a class="card-link" href="${escAttr(card.link)}" target="_blank" rel="noopener">↗ Weiterführender Link</a>`;
    }

    // Progress dots
    let dots = '<div class="progress">';
    for (let i = 0; i < total; i++) {
      dots += `<div class="dot${i < curIdx ? ' revealed' : ''}${i === curIdx ? ' current' : ''}"></div>`;
    }
    dots += '</div>';

    const hintText = remaining === 1 ? 'Letzte Karte' : `${remaining} Karten übrig`;
    const btnLabel = curIdx < total - 1 ? 'Nächste Hilfekarte aufdecken' : 'Letzte Karte – fertig';

    area.innerHTML = `
      <div class="stack-hint">${hintText}</div>
      <div class="card-wrapper">
        ${ghosts}
        <div class="card flip-in">
          <div class="card-number">Hilfe ${curIdx + 1} von ${total}</div>
          <div class="card-title">${escHtml(card.title)}</div>
          ${body}
        </div>
      </div>
      ${dots}
      <div class="btns">
        <button class="btn-next" onclick="nextCard()">${btnLabel}</button>
        <button class="btn-reset" onclick="resetCards()">↩ Reset</button>
      </div>`;
  }

  // ── Actions ──────────────────────────────────────────────────────────────
  function nextCard() {
    const card = document.querySelector('.card');
    if (card) {
      card.classList.add('flip-out');
      setTimeout(() => { curIdx++; renderCard(); }, 260);
    }
  }

  function resetCards() {
    curIdx = 0;
    renderCard();
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function escAttr(str) {
    return String(str).replace(/"/g, '&quot;');
  }

  document.getElementById('footerYear').textContent = new Date().getFullYear();
</script>
</body>
</html>
